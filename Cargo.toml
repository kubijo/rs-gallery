[package]
name = "gallery"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
# Code is Unlicense; bundled Noto fonts are SIL OFL 1.1; Phosphor-derived icons are MIT.
license = "Unlicense AND OFL-1.1 AND MIT"
description = "egui-shelled component catalog: a fixed egui shell + Storybook-style scene discovery (config globs, `#[scene]` + inventory)."
readme = "README.md"
keywords = ["egui", "components", "gui", "catalog", "preview"]
categories = ["gui", "development-tools"]

[dependencies]
camino = { version = "1", features = ["serde1"] }
cargo_metadata = "0.23"
egui = { version = "0.36", features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = [
   "accesskit",
   "wgpu",
   "glow",
   "default_fonts",
   "wayland",
   "x11",
] }
winit = { version = "0.30", default-features = false }
inventory = "0.3"
gallery-macros = { path = "gallery-macros" }
gallery-build = { path = "gallery-build" }
libloading = "0.9"
tempfile = "3"
notify = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
toml = "1"
usvg = { version = "0.50", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
sublime_fuzzy = "0.7"
process-wrap = { version = "10", features = ["std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
convert_case = "0.12"
egui_extras = { version = "0.36.0", default-features = false }
semver = "1"
ureq = "3"
clap = { version = "4", features = ["derive"] }
regex = "1"
anstream = "1"
anstyle = "1"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
kittest = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
crc32fast = "1"
openh264 = "0.9"
muxide = { version = "0.5", default-features = false }
glutin = { version = "0.32", default-features = false, features = ["egl"] }
supports-hyperlinks = "3"
anstyle-hyperlink = { version = "1", features = ["file"] }
miette = { version = "7", default-features = false, features = ["fancy-no-backtrace"] }
textwrap = "0.16"
comfy-table = { version = "8", features = ["custom_styling"] }
unicode-width = "0.2"
terminal_size = "0.4"
binpack2d = "1"
indoc = "2"
pollster = "1"
libtest-mimic = "0.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "stdio"] }

[features]
extras-svg = ["egui_extras/svg"]
extras-image = ["egui_extras/image"]
shell-scenes = []

[[example]]
name = "shell-scenes"
required-features = ["shell-scenes"]

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot"] }
mp4 = "0.14"

# Test-only, never linked: puts glow 0.16 in Cargo.lock so the
# `femtovg_demo_pins_a_glow_version_distinct_from_eframe` test can assert it stays distinct from eframe's
# glow 0.17. This is the glow the femtovg demo (femtovg 0.20.4) pulls; depended on directly rather than
# through femtovg, whose heavy tree — including unmaintained ttf-parser (RUSTSEC-2026-0192) — would
# otherwise land in the audit. gallery itself pins no glow version.
#
# `just outdated` flags it behind 0.18: bumping breaks the mirror rather than fixing a stale pin.
glow = "0.16"

[workspace]
members = ["gallery-macros", "gallery-build"]
# The instance scaffold isn't a real crate here — its manifest carries `cargo generate` placeholders.
exclude = ["template"]

# What the three crates share, so a release moves one line and `just release-check` has one answer
# to compare a tag against. Their licenses differ (only this one bundles fonts) and so do their
# descriptions, so those stay where they are.
[workspace.package]
version = "0.16.0"
edition = "2024"
publish = false
repository = "https://github.com/kubijo/rs-gallery"
