[package]
name = "gallery"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
# Code is Unlicense; the bundled Noto fallback fonts (fonts/noto/) are SIL OFL 1.1.
license = "Unlicense AND OFL-1.1"
description = "egui-shelled component catalog: a fixed egui shell + Storybook-style scene discovery (config globs, `#[scene]` + inventory)."
readme = "README.md"
keywords = ["egui", "components", "gui", "catalog", "preview"]
categories = ["gui", "development-tools"]

[dependencies]
camino = { version = "1", features = ["serde1"] }
egui = "0.36"
eframe = {
   version = "0.36",
   default-features = false,
   features = ["wgpu", "glow", "default_fonts", "wayland", "x11"]
}
inventory = "0.3"
gallery-macros = { path = "gallery-macros" }
# The launcher and a scenes `build.rs` must resolve `gallery.toml`'s globs to the same strings,
# so the reading lives in the crate the build script already pulls in.
gallery-build = { path = "gallery-build" }
# Gallery opens the scenes dylib itself; a reloader that closes the one it replaces cannot be used.
libloading = "0.9"
# Atomic temporary names keep concurrent gallery processes off each other's mapped dylibs.
tempfile = "3"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
usvg = { version = "0.48", default-features = false }
lyon = "1"
sublime_fuzzy = "0.7"
process-wrap = { version = "10", features = ["std"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
convert_case = "0.12"
egui_extras = { version = "0.36.0", default-features = false }
semver = "1"
ureq = "3"
clap = { version = "4", features = ["derive"] }
regex = "1"
anstream = "1"
anstyle = "1"
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
glutin = { version = "0.32", default-features = false, features = ["egl"] }
supports-hyperlinks = "3"
percent-encoding = "2"
binpack2d = "1"
indoc = "2"

[features]
# Forwarded egui_extras loader gates, so an instance enables one without declaring egui_extras.
extras-svg = ["egui_extras/svg"]
extras-image = ["egui_extras/image"]
# The shell's own chrome as scenes (`just shell-scenes`). Off by default: a consumer's sidebar is theirs.
shell-scenes = []

[[example]]
name = "shell-scenes"
required-features = ["shell-scenes"]

[dev-dependencies]
# `snapshot` here, not above: its differ would otherwise land in every consumer's binary for something
# only these tests do. Move it up behind an optional feature once consumers can verify (TODO, Tier 1).
egui_kittest = { version = "0.36", features = ["snapshot"] }

# Test-only, never linked: puts glow 0.16 in Cargo.lock so the
# `femtovg_demo_pins_a_glow_version_distinct_from_eframe` test can assert it stays distinct from eframe's
# glow 0.17. This is the glow the femtovg demo (femtovg 0.20.4) pulls; depended on directly rather than
# through femtovg, whose heavy tree — including unmaintained ttf-parser (RUSTSEC-2026-0192) — would
# otherwise land in the audit. gallery itself pins no glow version.
#
# `just outdated` flags it behind 0.18: bumping breaks the mirror rather than fixing a stale pin.
glow = "0.16"

[workspace]
members = ["gallery-macros", "gallery-build"]
# The instance scaffold isn't a real crate here — its manifest carries `cargo generate` placeholders.
exclude = ["template"]

# What the three crates share, so a release moves one line and `just release-check` has one answer
# to compare a tag against. Their licenses differ (only this one bundles fonts) and so do their
# descriptions, so those stay where they are.
[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false
repository = "https://github.com/kubijo/rs-gallery"
