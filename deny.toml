# cargo-deny dependency policy — https://embarkstudios.github.io/cargo-deny/
# `just audit` (and the CI `report (audit)` job) runs advisories + bans + licenses + sources.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots' bundled Mozilla CA data (ureq/rustls TLS) — a permissive data license.
  "CDLA-Permissive-2.0",
  # egui's bundled default fonts.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # Our own crates.
  "Unlicense",
]
# MPL-2.0 is copyleft per *file*, so an unmodified crate carries nothing outward — per crate, though,
# not blanket. `colored` arrives under the reference tests' image differ. Should comparison ever ship
# to consumers it lands in their binaries too, which is worth re-examining rather than inheriting.
exceptions = [{ allow = ["MPL-2.0"], crate = "colored" }]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# gallery-macros / gallery-build path deps carry no version by design; only flag registry wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
