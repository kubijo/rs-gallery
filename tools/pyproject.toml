[project]
name = "gallery-tools"
version = "0.1.0"
description = "The repo's Python tools behind console scripts: profile analysis, and cutting a release."
requires-python = ">=3.14"

# Maintained libraries rather than hand-rolled equivalents — a CLI is a solved problem, and typer
# carries rich, which is what the release preview and its prompts are drawn with.
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
gallery-perf = "gallery_perf.cli:main"
gallery-release = "gallery_release.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallery_perf", "src/gallery_release"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# Named rather than left to `src`, which ruff resolves against the directory holding this
# file: repofmt and repochk pass it by store path, where that directory is /nix/store.
[tool.ruff.lint.isort]
known-first-party = ["gallery_perf", "gallery_release"]
