<dialog id="lightbox" aria-label="Images of a check">
    <div class="bar">
        <fieldset class="names" aria-label="Image">
        </fieldset>
        <button type="button" class="flicker" aria-pressed="false">
            flicker <kbd>f</kbd>
        </button>
        <button type="button" class="fit">
            fit <kbd>0</kbd>
        </button>
        <span class="which unseen" role="status"></span>
        <span class="zoom"></span>
        <span class="aside">
            <kbd>←</kbd> <kbd>→</kbd> step, wheel or <kbd>+</kbd> <kbd>−</kbd> zooms,
            drag or <kbd>Shift</kbd> and an arrow pans
        </span>
        <button type="button" class="close">
            close <kbd>Esc</kbd>
        </button>
    </div>
    <div class="stage" tabindex="-1" autofocus>
        <img alt="">
    </div>
</dialog>
