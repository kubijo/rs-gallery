# The recipe behind `tests/snapshots/`, run by the capture test in `src/render.rs`. No `out`: the test
# supplies one, since these PNGs are scratch and only the references are committed.
#
# Sizes are roomy because the canvas scrolls, and an image cut off at the edge hides the layout change
# it exists to catch. Look at a new one before committing it.

# Gathers the shots below, so the packing and the captions are covered by the same comparison.
sheet = "sheet.png"

[[shot]]
name = "documented-stage"
scene = "documented-stage"
size = "360x220"

[[shot]]
name = "stage-forms"
scene = "stage-forms"
size = "320x400"

[[shot]]
name = "glyph-fallbacks"
scene = "glyph-fallbacks"
size = "300x160"

# Values that differ from every default the scene declares, so the image is evidence the overrides
# arrived rather than evidence the defaults did.
[[shot]]
name = "knobs-applied"
scene = "knobs-applied"
size = "320x140"
knobs = { caption = "overridden", tint = "#e8a33d", width = 230 }

[[shot]]
name = "offscreen-gl"
scene = "offscreen-gl"
size = "160x160"

# Several call sites in one scene: each keeps its own texture, so the shapes and colours differ.
# The last is staged, so its chrome is guarded too.
[[shot]]
name = "offscreen-slots"
scene = "offscreen-slots"
size = "200x200"

# The same scene twice, holding a GL object between the two. Green only while that object still
# belongs to the live context — which it does exactly as long as the run keeps one. Two shots
# because one cannot show a context outliving anything.
[[shot]]
name = "offscreen-cached-first"
scene = "offscreen-cached"
size = "120x120"

[[shot]]
name = "offscreen-cached-again"
scene = "offscreen-cached"
size = "120x120"
