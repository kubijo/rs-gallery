# Paths are relative to this file.

# Scene files, e.g. `["../my-components/src/**/*.scene.rs"]`.
scene_globs = ["{{scene_globs}}"]
# hot_watch_paths = ["../shared/assets"] # more to hot-reload on
title = "{{title}}"

# How far a play's screenshot may stray from its reference.
# [snapshots]
# threshold = 0.1 # colour distance, 0 to 1
# tolerance = 0 # pixels allowed to differ
# [snapshots.wgpu] # per renderer
# tolerance = 200

# The tests' videos and HTML report.
# [tests]
# video = "failing" # or "off", "always"
# output = "target/tests"

# Every recording's defaults.
# [record]
# format = "mp4" # or "apng", or ["apng", "mp4"]
# hold = 0.5 # seconds paused at each step
# input = "bottom-left" # keys and mouse panel corner, or false
# cursor_default = "brand/cursor.svg" # colour-filled SVG paths only
# cursor_pressed = "brand/cursor-pressed.svg"
# cursor_hotspot = [1, 1]
