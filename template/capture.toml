# A capture recipe: the scene states `just capture` renders to PNGs, headlessly.
#
# Knobs live here rather than in command-line flags because a label can contain spaces,
# and because a set of states is worth keeping — reviewable in a diff, re-runnable after a change.
# `just knobs <scene>` prints the labels a scene declares.

# Where the PNGs go, relative to this file. `just capture <file> <dir>` overrides it.
out = "renders"
# The canvas each shot renders at, unless it says otherwise. In points, as a window measures.
size = "640x360"
# Device pixels to the point, as a display's scale factor sets it — the same layout at that many
# times the pixels. One for one unless set, here or on a shot. `scale = 2` is what a HiDPI screen
# shows; anything a scene sizes in device pixels stays put while the rest of the picture grows.
# scale = 2
# Each PNG is cropped to what its scene drew; `trim = false` here or on a shot keeps the whole canvas.
# Gather every shot onto one captioned image too. Drop the line to write only the shots themselves.
sheet = "sheet.png"
# What the run came to, as JSON: a record per shot with its name, path, size, `settled` and the
# frames it drew. For a loop that renders a set and looks at the results without anyone watching.
report = "capture.json"
# Shoot each scene once it stops asking to be redrawn, rather than always drawing `frames` of them.
# `frames` becomes the most to draw: a scene that settles sooner is caught sooner, and one that never
# settles — an endless animation — is caught there and reported as still moving. Per-shot too.
settle = true

[[shot]]
# The name is the shot's identity and its filename — here `renders/knobs-choice.png`.
name = "knobs-choice"
# A whole scene key, or a case-insensitive regex;
# it has to match exactly one scene.
scene = "knobs::choice"
# Each key is a knob's label, or a regex over the labels.
# A choice is set by option label.
# Values are re-applied before every frame, so they outrank
# anything the scene writes to its own knobs.
knobs = { select = "two", radio = "three", buttons = "one" }

[[shot]]
name = "knobs-colour"
scene = "knobs::color"
knobs = { tint = "#E8A33D" }

[[shot]]
name = "knobs-everything"
scene = "knobs::group"
size = "480x240"
# Numbers and booleans are written as themselves;
# `x` and `y` are two knobs, matched exactly.
knobs = { x = 0.6, y = -0.4, tint = "#7FD4A0", bold = true }

# Far smaller than the canvas it lays out in, so trim takes most of the PNG.
[[shot]]
name = "badge"
scene = "badge"

# Not egui content: the drawing is a wgpu paint callback, which a capture runs exactly
# as a window does — the knobs land in the shader's uniform buffer either way.
[[shot]]
name = "wgpu-gradient"
scene = "wgpu::gradient"
knobs = { bias = 1.6 }

# The same solid by both routes, side by side. Drawn into egui's own render pass the far faces
# land on the near ones, that pass carrying no depth buffer to sort them; drawn into the target
# `ctx.render_pass` hands over, which does, it comes out a cube.
[[shot]]
name = "wgpu-depth"
scene = "wgpu::depth"
size = "520x300"

[[shot]]
name = "orbit-mid-spin"
scene = "orbit"
size = "480x480"
# Orbit animates forever, so it never settles: this is the frame it is caught at.
settle = false
frames = 40
knobs = { dots = 96, radius = 150, accent = "#6C9CD8" }
