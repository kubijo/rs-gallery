# What `just demo::recordings` leaves in .tmp/recordings/<backend>/: each tour's image, and its recording in every format.
version = 1
strict = true

[paths]
"report.json" = { type = "file", min_size = 1 }
"checks-tour.{png,apng,mp4}" = { type = "file", count = 3, min_size = 1 }
"studio-tour.{png,apng,mp4}" = { type = "file", count = 3, min_size = 1 }
