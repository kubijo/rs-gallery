# `just demo::recordings`: the two plays worth watching, each in every video format.
# No `out`: the script passes one per backend under .tmp/recordings/.
report = "report.json"

# Every kind of input across a full-stage scene, the keys and mouse shown over it.
[[shot]]
name = "studio-tour"
scene = "studio"
size = "960x540"
play = "tours_every_kind_of_input"
record = { fps = 30, format = ["apng", "mp4", "gif"] }

# Every matcher there is, passing in turn on a form recorded as it is.
[[shot]]
name = "checks-tour"
scene = "checks"
size = "560x400"
play = "checks_with_every_matcher"
record = { fps = 30, format = ["apng", "mp4", "gif"] }
